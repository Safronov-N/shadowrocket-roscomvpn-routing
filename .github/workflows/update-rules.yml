name: Update Shadowrocket rules

on:
  push:
    paths:
      - .github/workflows/update-rules.yml
      - scripts/generate.main.kts
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4

      - name: Сгенерировать правила
        run: kotlinc -script scripts/generate.main.kts

      - name: Проверить результат
        run: |
          test -s rules/BLOCK.list
          test -s rules/PROXY.list
          test -s rules/DIRECT.list
          grep -q '^DOMAIN-' rules/BLOCK.list
          grep -q '^DOMAIN-' rules/PROXY.list
          grep -q '^IP-CIDR' rules/DIRECT.list

      - name: Опубликовать изменения
        run: |
          if ! git status --porcelain -- rules | grep -q .; then
            echo "Правила не изменились"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules
          git commit -m "Обновить правила из RoscomVPN"
          git push
