name: Update Shadowrocket rules

on:
  push:
    paths:
      - .github/workflows/update-rules.yml
      - scripts/generate.main.kts
      - shadowrocket.template.conf
      - netbird-mdb.module
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4

      - name: Сгенерировать правила
        run: kotlinc -script scripts/generate.main.kts

      - name: Проверить результат
        run: |
          test -s rules/BLOCK.list
          test -s rules/PROXY.list
          test -s rules/DIRECT.list
          test -s shadowrocket.conf
          test -s netbird-mdb.module
          grep -q '^DOMAIN-' rules/BLOCK.list
          grep -q '^DOMAIN-' rules/PROXY.list
          grep -q '^IP-CIDR' rules/DIRECT.list
          grep -q '^always-real-ip = ' shadowrocket.conf
          grep -Fq '*.netmonet.co' shadowrocket.conf
          grep -Fxq 'dns-server = tls://common.dot.dns.yandex.net' shadowrocket.conf
          grep -Fxq 'DOMAIN-SUFFIX,mdb.yandexcloud.net,DIRECT' shadowrocket.conf
          grep -Fq '{{{mdb_fqdn}}} = {{{mdb_ip}}}' netbird-mdb.module
          test -s examples/macos-resolver/mdb.yandexcloud.net.example

      - name: Опубликовать изменения
        run: |
          if ! git status --porcelain -- rules shadowrocket.conf | grep -q .; then
            echo "Правила не изменились"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules shadowrocket.conf
          git commit -m "Обновить профиль и правила из RoscomVPN"
          git push
