# NAME: RoscomVPN AUTO for Shadowrocket
# REPO: https://github.com/Safronov-N/shadowrocket-roscomvpn-routing
# Правила RoscomVPN конвертируются автоматически каждые 6 часов.
# Файл генерируется из shadowrocket.template.conf; ручные изменения будут перезаписаны.

[General]
bypass-system = true
skip-proxy = 127.0.0.1, 192.168.0.0/16, 10.0.0.0/8, 100.64.0.0/10, 172.16.0.0/12, localhost, *.local, captive.apple.com
tun-excluded-routes = 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.88.99.0/24, 192.168.0.0/16, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 255.255.255.255/32
# Публичный DNS обслуживает общий профиль. Private MDB требует split-DNS NetBird или macOS.
dns-server = tls://common.dot.dns.yandex.net
fallback-dns-server = https://dns.google/dns-query#proxy, https://cloudflare-dns.com/dns-query#proxy, system
dns-direct-system = false
# Ошибка DIRECT-DNS не должна отправлять private hostname публичному/proxy resolver.
dns-direct-fallback-proxy = false
ipv6 = false
# Разрешать частные адреса в DNS-ответах для локальных сетей и параллельных VPN.
private-ip-answer = true
# Полный TUN сохраняет доменную маршрутизацию Shadowrocket.
compatibility-mode = 3
hijack-dns = :53
allow-dns-all = true
# Совместимые whitelist-домены получают реальные DNS-ответы для DIRECT-сервисов.
always-real-ip = {{ROSCOMVPN_WHITELIST_ALWAYS_REAL_IP}}
update-url = https://raw.githubusercontent.com/Safronov-N/shadowrocket-roscomvpn-routing/main/shadowrocket.conf

{{ROSCOMVPN_DNS_HOSTS_SECTION}}

[Script]
private-ip-if-non-match = type=rule,script-path=https://raw.githubusercontent.com/Safronov-N/shadowrocket-roscomvpn-routing/main/scripts/private-ip-if-non-match.js

[Rule]
# Yandex MDB должен быть определён как DIRECT до удалённых списков.
DOMAIN-SUFFIX,mdb.yandexcloud.net,DIRECT

# Локальные сети.
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve

# RoscomVPN BLOCK и дополнительная блокировка рекламы.
RULE-SET,https://raw.githubusercontent.com/Safronov-N/shadowrocket-roscomvpn-routing/main/rules/BLOCK.list,REJECT
RULE-SET,https://raw.githubusercontent.com/zeklop/shadowrocket-configs/main/REJECT.list,REJECT

# Проверки внешнего IP всегда показывают адрес прокси.
DOMAIN-SUFFIX,2ip.ru,PROXY
DOMAIN-SUFFIX,ipify.org,PROXY
DOMAIN-SUFFIX,ifconfig.me,PROXY
DOMAIN-SUFFIX,ip.sb,PROXY
DOMAIN-SUFFIX,checkip.amazonaws.com,PROXY
DOMAIN-SUFFIX,ipapi.is,PROXY
DOMAIN-SUFFIX,iplocate.io,PROXY
DOMAIN-SUFFIX,showip.net,PROXY

# RoscomVPN PROXY.
RULE-SET,https://raw.githubusercontent.com/Safronov-N/shadowrocket-roscomvpn-routing/main/rules/PROXY.list,PROXY

# Независимые актуальные блокировки РФ должны идти раньше DIRECT.
DOMAIN-SET,https://raw.githubusercontent.com/1andrevich/Re-filter-lists/main/domains_all.lst,PROXY
DOMAIN-SET,https://raw.githubusercontent.com/1andrevich/Re-filter-lists/main/community.lst,PROXY
RULE-SET,https://raw.githubusercontent.com/1andrevich/Re-filter-lists/main/ipsum.lst,PROXY
RULE-SET,https://raw.githubusercontent.com/1andrevich/Re-filter-lists/main/community_ips.lst,PROXY
RULE-SET,https://raw.githubusercontent.com/1andrevich/Re-filter-lists/main/discord_ips.lst,PROXY

# RoscomVPN DIRECT: домены и IP из текущего DEFAULT.JSON.
RULE-SET,https://raw.githubusercontent.com/Safronov-N/shadowrocket-roscomvpn-routing/main/rules/DIRECT.list,DIRECT

# Национальные зоны после списков блокировок.
DOMAIN-SUFFIX,ru,DIRECT
DOMAIN-SUFFIX,xn--p1ai,DIRECT
DOMAIN-SUFFIX,su,DIRECT
DOMAIN-SUFFIX,by,DIRECT

# HAPP IPIfNonMatch: после промаха доменных правил резолвим домен и проверяем private IP.
SCRIPT,private-ip-if-non-match,DIRECT,requires-resolve

# GeoLite2 используется только как последний DIRECT-fallback для российских IP.
GEOIP,RU,DIRECT

FINAL,PROXY
